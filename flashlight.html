<div class="location_finder">
<p id="display" >location here</p>



<script>
var clickcounter=0;
var percent= 35;
document.addEventListener("mousemove", (e)=>{
let Mx = e.pageX;
let My = e.pageY;
document.getElementById('display').innerHTML= Mx+", "+My;
document.querySelector('#light').style.clipPath = "circle("+percent+"% at "+e.pageX+"px "+e.pageY+"px)";
});


document.addEventListener("click", (e)=>{ 
clickcounter++;
//alert(clickcounter%2);
if(clickcounter%2==0){
light_on();
}
else{
light_out();
}
});

function light_on(){
document.querySelector('.room').style.cursor= "none";
document.querySelector('#light').style.clipPath = "circle(35%)";
percent= 35;
}

function light_out(){
//alert("function triggered");
  document.querySelector('.room').style.cursor= "pointer";
  document.querySelector('#light').style.clipPath = "circle(0%)";
 percent= 0;
}

</script>
</div>

</body>
